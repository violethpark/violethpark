name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "CV*.md"
      - "style.css"
      - "convert.ts"
      - "images/**"
      - "package.json"
      - ".github/workflows/deploy-cv.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convert CV*.md → CV*.html
        run: npm run convert

      - name: Prepare deployment directory
        run: |
          mkdir -p _site/images
          mkdir -p _site/en/images
          mkdir -p _site/ko/images
          mkdir -p _site/jp/images

          # Copy and rename CV*.html → index*.html
          cp CV.html    _site/index.html
          cp CV.html    _site/en/index.html
          cp CV_ko.html _site/ko/index.html
          cp CV_jp.html _site/jp/index.html

          # Copy assets to root and subdirectories
          cp style.css _site/
          cp style.css _site/en/
          cp style.css _site/ko/
          cp style.css _site/jp/
          cp -r images/* _site/images/
          cp -r images/* _site/en/images/
          cp -r images/* _site/ko/images/
          cp -r images/* _site/jp/images/

          # Rewrite cross-language links (.md → clean URLs)
          sed -i 's|href="CV_ko\.md"|href="/ko/"|g' _site/index.html
          sed -i 's|href="CV_jp\.md"|href="/jp/"|g' _site/index.html

          sed -i 's|href="CV_ko\.md"|href="/ko/"|g' _site/en/index.html
          sed -i 's|href="CV_jp\.md"|href="/jp/"|g' _site/en/index.html

          sed -i 's|href="CV\.md"|href="/en/"|g'       _site/ko/index.html
          sed -i 's|href="CV_jp\.md"|href="/jp/"|g' _site/ko/index.html

          sed -i 's|href="CV\.md"|href="/en/"|g'       _site/jp/index.html
          sed -i 's|href="CV_ko\.md"|href="/ko/"|g' _site/jp/index.html

          # Custom domain CNAME
          echo "about.violethpark.com" > _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
