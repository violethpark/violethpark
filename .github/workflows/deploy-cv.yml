name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "CV*.md"
      - "style.css"
      - "convert.ts"
      - "heading-link.ts"
      - "page.ts"
      - "build-site.ts"
      - "subset-fonts.py"
      - "requirements-fonts.txt"
      - "images/**"
      - "fonts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-cv.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: 3.14.10

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    # The same pinned Debian container and Python as check.yml.
    container: debian:13.7-slim@sha256:89c1ea91e897f0fe0a3731595330bc45b8bdef4047464a07116f891a94054b31
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Debian packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Convert CV*.md → CV*.html
        run: npm run convert

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10
        with:
          version: 0.13.6

      - name: Install the font subsetter
        run: |
          uv python install "${PYTHON_VERSION}"
          "$(uv python find "${PYTHON_VERSION}")" -m venv "$RUNNER_TEMP/fonts"
          "$RUNNER_TEMP/fonts/bin/pip" install --require-hashes -r requirements-fonts.txt

      - name: Prepare deployment directory
        run: PYTHON="$RUNNER_TEMP/fonts/bin/python" npm run build-site -- _site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
