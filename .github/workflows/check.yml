name: Check

# Type checks, lint, and format of the build scripts and their settings:
# TypeScript (convert.ts, page.ts, build-site.ts) and subset-fonts.py, then a
# build of the site. The job runs in a pinned Debian container; uv installs
# the Python that pyrightconfig.json and ruff.toml target (Debian's is 3.13),
# the python-build-standalone build violethpark/workspace's Dev Container uses.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: 3.15.2

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container: debian:13.7-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    steps:
      - name: Debian packages
        run: |
          # The official Node 26 binary links libatomic.so.1, which debian:*-slim leaves out.
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libatomic1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The scripts are TypeScript only (AGENTS.md): JavaScript exists only as
      # Node's type-stripped code and the functions page.ts inlines into
      # CV*.html, never as a tracked file. tsc (no allowJs) and ESLint
      # (**/*.ts) skip a .js file, so count them here. A git failure fails the
      # step instead of reading as an empty list. The container runs as root
      # and the checkout belongs to the runner user, so git needs this
      # directory as safe.directory; -c keeps it to this one command.
      - name: No tracked JavaScript
        run: |
          js="$(git -c safe.directory="$PWD" ls-files -- '*.js' '*.mjs' '*.cjs' '*.jsx')"
          if [ -n "$js" ]; then
            printf '%s\n' "$js"
            echo "::error::Tracked JavaScript files; write them in TypeScript (AGENTS.md)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            config/lint/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix config/lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7

      # Pyright reads fontTools from this venv (pyrightconfig.json).
      - name: Install fontTools and Ruff
        run: |
          uv python install "${PYTHON_VERSION}"
          "$(uv python find "${PYTHON_VERSION}")" -m venv .venv-fonts
          .venv-fonts/bin/pip install --require-hashes -r requirements-fonts.txt -r requirements-dev.txt

      - name: Pyright
        run: npm run pyright

      - name: Ruff lint
        run: .venv-fonts/bin/ruff check

      - name: Ruff format
        run: .venv-fonts/bin/ruff format --check

      # The site itself, so a break in convert.ts, build-site.ts, or
      # subset-fonts.py shows here and not only in deploy-cv.yml after a merge.
      - name: Build the site
        run: |
          npm run convert
          PYTHON="$PWD/.venv-fonts/bin/python" npm run build-site -- "$RUNNER_TEMP/site"
